name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  security-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run linting
        working-directory: apps/backend
        run: npm run lint

      - name: Run tests
        working-directory: apps/backend
        run: npm test

      - name: Security baseline tests
        working-directory: apps/backend
        run: npm test security.baseline.spec.ts
        continue-on-error: true

      - name: Dependency audit
        working-directory: apps/backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

  strix-scan:
    runs-on: ubuntu-latest
    needs: security-preflight
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash
        continue-on-error: true

      - name: Run Strix Security Scan
        if: ${{ env.STRIX_LLM != '' && env.LLM_API_KEY != '' }}
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n -t ./ --scan-mode quick --max-budget 10 || true
          
          if [ -f "strix_runs" ]; then
            run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
            if [ -n "$run_json" ]; then
              status=$(cat "$run_json" | jq -r .status 2>/dev/null || echo "unknown")
              if [ "$status" != "completed" ]; then
                echo "Strix scan did not complete (status: $status)" >&2
                exit 1
              fi
            fi
          fi

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
        continue-on-error: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-scan-results
          path: strix_runs/
          retention-days: 30
        continue-on-error: true

  strix-cloud-pr-review:
    runs-on: ubuntu-latest
    needs: security-preflight
    if: github.event_name == 'pull_request' && secrets.STRIX_API_TOKEN != ''
    steps:
      - name: Trigger Strix Cloud PR Review
        env:
          STRIX_API_TOKEN: ${{ secrets.STRIX_API_TOKEN }}
        run: |
          curl -sS --fail https://app.strix.ai/api/v1/pr-reviews/start \
            -H "Authorization: Bearer $STRIX_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repository_full_name\":\"${{ github.repository }}\",\"pr_number\":${{ github.event.pull_request.number }}}"
        continue-on-error: true

  scheduled-deep-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash
        continue-on-error: true

      - name: Run Deep Security Scan
        if: ${{ env.STRIX_LLM != '' && env.LLM_API_KEY != '' }}
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: strix -n -t ./ --scan-mode standard --max-budget 30

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-weekly-scan-results
          path: strix_runs/
          retention-days: 90
