name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  security-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run linting
        working-directory: apps/backend
        run: npm run lint

      - name: Run tests
        working-directory: apps/backend
        run: npm test

      - name: Security baseline tests
        working-directory: apps/backend
        run: npm test security.baseline.spec.ts
        continue-on-error: true

      - name: Dependency audit
        working-directory: apps/backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

  strix-managed-scan:
    runs-on: ubuntu-latest
    needs: security-preflight
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run Strix Managed Scan
        if: ${{ secrets.STRIX_API_TOKEN != '' }}
        env:
          STRIX_API_TOKEN: ${{ secrets.STRIX_API_TOKEN }}
        run: |
          cd apps/backend
          node -e "
            const { SecurityScanExecutor } = require('./dist/core/security/scan');
            const executor = new SecurityScanExecutor(process.env.STRIX_API_TOKEN);
            const request = {
              target: process.env.SECURITY_TARGET_URL || './',
              targetType: 'repository',
              scanMode: 'quick',
              maxBudgetUsd: 10,
            };
            executor.executeScan(request).then(result => {
              console.log('SECURITY_SCAN_STATUS=' + result.status);
              console.log('SECURITY_FINDINGS_COUNT=' + result.findings.length);
              console.log('SECURITY_CRITICAL_COUNT=' + result.findings.filter(f => f.severity === 'CRITICAL').length);
              console.log('SECURITY_HIGH_COUNT=' + result.findings.filter(f => f.severity === 'HIGH').length);
              console.log('SECURITY_MEDIUM_COUNT=' + result.findings.filter(f => f.severity === 'MEDIUM').length);
              process.exit(result.status === 'COMPLETED' ? 0 : 1);
            }).catch(e => {
              console.error('SECURITY_SCAN_ERROR=' + e.message);
              process.exit(1);
            });
          "
        continue-on-error: true

      - name: Scan Skipped - Not Configured
        if: secrets.STRIX_API_TOKEN == ''
        run: |
          echo "SECURITY_SCAN_STATUS=SKIPPED_NOT_CONFIGURED"
          echo "SECURITY_SCAN_STATUS=SKIPPED_NOT_CONFIGURED" >> $GITHUB_OUTPUT
          echo "Security scan skipped: STRIX_API_TOKEN secret not configured"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apps/backend/strix_runs
        continue-on-error: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-scan-results
          path: apps/backend/strix_runs/
          retention-days: 30
        continue-on-error: true

  strix-cloud-pr-review:
    runs-on: ubuntu-latest
    needs: security-preflight
    if: github.event_name == 'pull_request' && secrets.STRIX_API_TOKEN != ''
    steps:
      - name: Trigger Strix Cloud PR Review
        env:
          STRIX_API_TOKEN: ${{ secrets.STRIX_API_TOKEN }}
        run: |
          curl -sS --fail https://app.strix.ai/api/v1/pr-reviews/start \
            -H "Authorization: Bearer $STRIX_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repository_full_name\":\"${{ github.repository }}\",\"pr_number\":${{ github.event.pull_request.number }}}"
        continue-on-error: true

  scheduled-deep-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run Deep Security Scan
        if: ${{ secrets.STRIX_API_TOKEN != '' }}
        env:
          STRIX_API_TOKEN: ${{ secrets.STRIX_API_TOKEN }}
        run: |
          cd apps/backend
          node -e "
            const { SecurityScanExecutor } = require('./dist/core/security/scan');
            const executor = new SecurityScanExecutor(process.env.STRIX_API_TOKEN);
            const request = {
              target: './',
              targetType: 'repository',
              scanMode: 'standard',
              maxBudgetUsd: 30,
            };
            executor.executeScan(request).then(result => {
              console.log('SECURITY_SCAN_STATUS=' + result.status);
              console.log('SECURITY_FINDINGS_COUNT=' + result.findings.length);
              process.exit(result.status === 'COMPLETED' ? 0 : 1);
            }).catch(e => {
              console.error('SECURITY_SCAN_ERROR=' + e.message);
              process.exit(1);
            });
          "
        continue-on-error: true

      - name: Scan Skipped - Not Configured
        if: secrets.STRIX_API_TOKEN == ''
        run: |
          echo "SECURITY_SCAN_STATUS=SKIPPED_NOT_CONFIGURED"
          echo "Security scan skipped: STRIX_API_TOKEN secret not configured"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-weekly-scan-results
          path: apps/backend/strix_runs/
          retention-days: 90
        continue-on-error: true