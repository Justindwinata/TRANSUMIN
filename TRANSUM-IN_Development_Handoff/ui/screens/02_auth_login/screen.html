<p class="font-body-md text-body-md text-on-surface-variant">Masuk untuk mengelola perjalanan harian Anda.</p>

<form action="#" class="space-y-md" method="POST">
<!-- Email Input -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-[48px] pl-10 pr-sm bg-surface border border-outline-variant rounded text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="relative">
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-label-md text-label-md text-primary hover:text-transjakarta-blue transition-colors" href="#">Lupa sandi?</a>
</div>
<div class="relative">

<input class="w-full h-[48px] pl-10 pr-10 bg-surface border border-outline-variant rounded text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-primary-container text-on-primary font-title-lg text-title-lg rounded hover:bg-transjakarta-blue active:scale-95 transition-all flex items-center justify-center mt-lg shadow-sm" type="submit">
                    Masuk
                </button>
</form>
<div class="mt-lg relative flex items-center py-sm">

<span class="material-symbols-outlined text-[#1877F2]">qr_code_2</span>

<script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        });
    </script>
