<!-- Script to simulate map panning subtly for a dynamic feel -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const mapBg = document.querySelector('[data-location="Jakarta"]');
            let posX = 0;
            let posY = 0;
            
            // Simple gentle auto-pan to make the map feel "live" if it were a static image
            setInterval(() => {
                posX -= 0.1;
                posY -= 0.05;
                if (mapBg) {
                    mapBg.style.backgroundPosition = `${posX}px ${posY}px`;
                }
            }, 50);
        });
    </script>
